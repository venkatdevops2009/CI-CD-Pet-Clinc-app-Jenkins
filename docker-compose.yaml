name: petclinc

services:
  mysql:
    build: ./mysql
    image: piridi/petclinc-mysql:v1
    container_name: petclinic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petclinic}
      MYSQL_USER: ${MYSQL_USER:-petclinic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-petclinic}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  petclinic:
    build: ./petclinc
    image: piridi/petclinc:v1
    container_name: petclinic-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-petclinic}
      DB_USERNAME: ${MYSQL_USER:-petclinic}
      DB_PASSWORD: ${MYSQL_PASSWORD:-petclinic}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql-data: